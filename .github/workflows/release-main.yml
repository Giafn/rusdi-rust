name: Release main build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: rudis-lite-linux-x86_64
            binary: rudis-lite
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: rudis-lite-linux-aarch64
            binary: rudis-lite
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: rudis-lite-windows-x86_64.exe
            binary: rudis-lite.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build ARM64 Linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}
      - name: Build native target
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary in build folder
        shell: bash
        run: |
          mkdir -p build
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "build/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: build/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish main-latest prerelease
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true
      - name: Generate checksums
        working-directory: build
        run: sha256sum rudis-lite-* > SHA256SUMS
      - name: Update rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-latest
          name: Rudis Lite Main Latest
          prerelease: true
          draft: false
          make_latest: false
          generate_release_notes: false
          body: |
            Automated prerelease built from the latest main branch.
            This release is for testing only.
          files: |
            build/rudis-lite-linux-x86_64
            build/rudis-lite-linux-aarch64
            build/rudis-lite-windows-x86_64.exe
            build/SHA256SUMS
